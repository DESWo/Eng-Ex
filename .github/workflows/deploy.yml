name: Deploy to GitHub Pages

# Builds the Vite app and publishes it to GitHub Pages on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; newer pushes cancel older in-progress builds.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The verify scripts import .ts sources directly, so Node must strip
          # types without a flag. That landed in 22.18; 24 is the current LTS
          # and has it across the whole line.
          node-version: 24
          # Keyed on package-lock.json. This only warms the ~/.npm download
          # cache, it never skips a step: npm ci, lint, build and verify below
          # all run on every push, cache hit or miss.
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      # Physics and level guards. `npm run verify` runs every
      # scripts/verify-*.mjs and exits non-zero if any of them fails, which
      # fails this job. `deploy` needs `build`, so nothing ships on a red check.
      - run: npm run verify

      # GitHub Pages has no SPA fallback, so serve the app for unknown paths
      # (e.g. /eng-ex/explore/nuclear) by copying index.html to 404.html.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
